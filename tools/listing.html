<!doctype html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  body { margin:0; width:1280px; height:800px; background:#0d1117; color:#e6edf3;
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow:hidden; }
  .wrap { display:flex; gap:44px; padding:40px; height:800px; }
  .shots { display:flex; gap:20px; flex:0 0 auto; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .cap { font-size:15px; letter-spacing:.09em; text-transform:uppercase; color:#8b949e; }
  .panel { width:290px; height:660px; overflow:hidden; border:1px solid #30363d; border-radius:10px; }
  .panel img { width:290px; display:block; }
  .note { font-size:17px; color:#e6edf3; }
  .note b { color:#d29922; }
  .say { flex:1 1 auto; padding-top:26px; }
  h1 { margin:0 0 20px; font-size:50px; line-height:1.06; letter-spacing:-.02em; font-weight:700; }
  p { margin:0 0 18px; font-size:21px; line-height:1.5; color:#c9d1d9; max-width:19em; }
  .barbox { width:300px; height:50px; overflow:hidden; margin:30px 0 12px; border-radius:8px; }
  .bar { display:block; width:300px; }
  .barcap { font-size:16px; color:#8b949e; }
</style></head><body>
  <div class="wrap">
    <div class="shots">
      <div class="col">
        <div class="cap">Before</div>
        <div class="panel"><img src="before.png" style="margin-top:-{{CROP}}px"></div>
      </div>
      <div class="col">
        <div class="cap">After</div>
        <div class="panel"><img src="after.png" style="margin-top:-{{CROP}}px"></div>
        <div class="note"><b>Half the page,</b> gone</div>
      </div>
    </div>
    <div class="say">
      <h1>Quiet<br>the bots</h1>
      <p>Every pull request collects coverage reports, CI summaries and AI reviews. One button puts
        them away, each leaving a single line you can click to bring it back.</p>
      <p>What people wrote is never touched.</p>
      <div class="barbox"><img class="bar" src="bar.png"></div>
      <div class="barcap">Two buttons, on every pull request and issue.</div>
    </div>
  </div>
</body></html>
